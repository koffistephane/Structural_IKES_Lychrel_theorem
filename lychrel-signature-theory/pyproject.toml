[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lychrel-signature-theory"
version = "0.1.0"
description = "Symmetric signatures and canonical nodes for experimental Lychrel candidates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emmanuel IBOHN KOFFI" }]
keywords = ["lychrel", "reverse-and-add", "experimental-number-theory"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
